<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт посещаемости — Школа 107</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F0F5FA; color: #1F2937; padding: 20px; }
        .app-container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E5E7EB; padding-bottom: 16px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .logo { font-size: 20px; font-weight: 700; color: #3A5A7A; }
        .header-btns { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 9px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #4F6F8F; color: #fff; }
        .btn-primary:hover { background: #3A5A7A; }
        .btn-success { background: #10B981; color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-outline { background: #F3F4F6; color: #374151; border: 1px solid #D1D5DB; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: #F9FAFB; border: 1px solid #E5E7EB; padding: 16px; border-radius: 12px; text-align: center; }
        .stat-card .val { font-size: 26px; font-weight: 700; color: #111827; }
        .stat-card .lbl { font-size: 13px; color: #6B7280; margin-top: 4px; }
        .tabs { display: flex; gap: 8px; border-bottom: 2px solid #E5E7EB; margin-bottom: 20px; }
        .tab { padding: 10px 18px; border: none; background: none; font-size: 14px; font-weight: 600; color: #6B7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #4F6F8F; border-bottom-color: #4F6F8F; }
        .section { display: none; }
        .section.active { display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 20px; }
        .card h3 { margin-bottom: 14px; font-size: 16px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        .table-wrap { overflow-x: auto; max-height: 450px; border: 1px solid #E5E7EB; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; }
        th, td { padding: 10px 14px; border-bottom: 1px solid #E5E7EB; text-align: left; }
        th { background: #F3F4F6; font-weight: 600; position: sticky; top: 0; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo">🏫 Учёт посещаемости №107</div>
        <div class="header-btns">
            <label class="btn btn-success">
                📁 Загрузить новый Excel
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display:none;" onchange="importExcelFile(event)">
            </label>
            <button class="btn btn-outline" onclick="resetToBuiltin()">Сбросить к исходным (1718)</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="val" id="statTotal">1718</div><div class="lbl">Всего учеников</div></div>
        <div class="stat-card"><div class="val" id="statClasses">0</div><div class="lbl">Классов</div></div>
        <div class="stat-card"><div class="val" id="statToday">0</div><div class="lbl">Отметок сегодня</div></div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('tab-mark', this)">Отметка</button>
        <button class="tab" onclick="switchTab('tab-students', this)">Список учеников</button>
        <button class="tab" onclick="switchTab('tab-journal', this)">Журнал</button>
    </div>

    <!-- Вкладка отметки -->
    <div id="tab-mark" class="section active">
        <div class="grid-2">
            <div class="card">
                <h3>Форма отметки</h3>
                <select id="classFilter" onchange="onClassChange()">
                    <option value="">— Выберите класс —</option>
                </select>
                <input type="text" id="nameSearch" placeholder="Поиск по фамилии..." oninput="onSearchChange()">
                <select id="studentSelect">
                    <option value="">— Сначала выберите класс —</option>
                </select>
                <select id="statusSelect">
                    <option value="Присутствует">Присутствует</option>
                    <option value="Опоздал">Опоздал</option>
                    <option value="Отсутствует">Отсутствует</option>
                    <option value="Причина">Уважительная причина</option>
                </select>
                <input type="text" id="noteInput" placeholder="Примечание (необязательно)">
                <button class="btn btn-primary" style="width:100%" onclick="saveRecord()">Сохранить отметку</button>
            </div>
            <div class="card">
                <h3>Записи за сегодня</h3>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Время</th><th>ФИО</th><th>Класс</th><th>Статус</th></tr></thead>
                        <tbody id="todayList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Вкладка списка учеников -->
    <div id="tab-students" class="section">
        <div style="display:flex; gap:10px; margin-bottom:12px;">
            <input type="text" id="studentListSearch" placeholder="Быстрый поиск ученика или класса..." oninput="renderStudentsTable()" style="margin:0;">
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>№</th><th>Ф.И.О.</th><th>Класс</th></tr></thead>
                <tbody id="studentsTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Вкладка журнала -->
    <div id="tab-journal" class="section">
        <div class="table-wrap">
            <table>
                <thead><tr><th>Дата</th><th>Время</th><th>ФИО</th><th>Класс</th><th>Статус</th><th>Примечание</th></tr></thead>
                <tbody id="journalTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Полноценный встроенный файл с автозагрузкой ваших 1718 учеников
    let BUILTIN_DATA = [];
    let students = [];
    let records = JSON.parse(localStorage.getItem('attendance_records') || '[]');

    // При открытии сайта автоматически загружаем файл контингент_2.xlsx
    window.onload = function() {
        const saved = localStorage.getItem('loaded_students');
        if (saved) {
            students = JSON.parse(saved);
            updateAll();
        } else {
            // Если в браузере ничего нет, тянем файл из папки GitHub
            fetch('контингент_2.xlsx')
                .then(res => res.arrayBuffer())
                .then(buffer => {
                    const wb = XLSX.read(buffer, {type: 'array'});
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(sheet);
                    students = data.map((r, i) => ({
                        id: 'STU-' + (r['№'] || (i + 1)),
                        name: String(r['Ф.И.О.'] || r['ФИО'] || '').trim(),
                        class: String(r['класс'] || r['Класс'] || '').trim()
                    })).filter(s => s.name);
                    BUILTIN_DATA = [...students];
                    updateAll();
                })
                .catch(err => {
                    console.log('Ждем ручной импорт или локальную загрузку');
                    updateAll();
                });
        }
    };

    function importExcelFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet);

                students = rows.map((r, i) => ({
                    id: 'STU-' + (r['№'] || (i + 1)),
                    name: String(r['Ф.И.О.'] || r['ФИО'] || r['Name'] || '').trim(),
                    class: String(r['класс'] || r['Класс'] || r['Class'] || '').trim()
                })).filter(s => s.name !== '');

                localStorage.setItem('loaded_students', JSON.stringify(students));
                alert(`Успешно импортировано ${students.length} учеников!`);
                updateAll();
            } catch (err) {
                alert('Ошибка импорта Excel: ' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function resetToBuiltin() {
        localStorage.removeItem('loaded_students');
        location.reload();
    }

    function updateAll() {
        document.getElementById('statTotal').textContent = students.length;
        const classes = [...new Set(students.map(s => s.class))].filter(Boolean).sort();
        document.getElementById('statClasses').textContent = classes.length;
        
        const todayStr = new Date().toLocaleDateString('ru-RU');
        const todayRecs = records.filter(r => r.date === todayStr);
        document.getElementById('statToday').textContent = todayRecs.length;

        const classSelect = document.getElementById('classFilter');
        const currentCls = classSelect.value;
        classSelect.innerHTML = '<option value="">— Выберите класс —</option>' + 
            classes.map(c => `<option value="${c}">${c}</option>`).join('');
        classSelect.value = currentCls;

        onClassChange();
        renderStudentsTable();
        renderJournal();
    }

    function onClassChange() {
        const cls = document.getElementById('classFilter').value;
        const q = document.getElementById('nameSearch').value.toLowerCase();
        const sel = document.getElementById('studentSelect');

        let filtered = students.filter(s => 
            (!cls || s.class === cls) && 
            (!q || s.name.toLowerCase().includes(q))
        );

        sel.innerHTML = filtered.length === 0 
            ? '<option value="">Никого не найдено</option>'
            : '<option value="">— Выберите ученика —</option>' + filtered.map(s => `<option value="${s.id}">${s.name} (${s.class})</option>`).join('');
    }

    function onSearchChange() {
        onClassChange();
    }

    function renderStudentsTable() {
        const q = document.getElementById('studentListSearch').value.toLowerCase();
        const tbody = document.getElementById('studentsTable');
        const filtered = students.filter(s => !q || s.name.toLowerCase().includes(q) || s.class.toLowerCase().includes(q));
        
        tbody.innerHTML = filtered.map((s, idx) => `
            <tr>
                <td>${idx + 1}</td>
                <td><strong>${s.name}</strong></td>
                <td>${s.class}</td>
            </tr>
        `).join('');
    }

    function saveRecord() {
        const id = document.getElementById('studentSelect').value;
        const status = document.getElementById('statusSelect').value;
        const note = document.getElementById('noteInput').value;

        if (!id) return alert('Выберите ученика!');
        const st = students.find(s => s.id === id);

        const now = new Date();
        const rec = {
            date: now.toLocaleDateString('ru-RU'),
            time: now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),
            name: st.name,
            class: st.class,
            status: status,
            note: note
        };

        records.unshift(rec);
        localStorage.setItem('attendance_records', JSON.stringify(records));
        document.getElementById('noteInput').value = '';
        updateAll();
        alert('Запись сохранена');
    }

    function renderJournal() {
        const todayStr = new Date().toLocaleDateString('ru-RU');
        const todayRecs = records.filter(r => r.date === todayStr);

        document.getElementById('todayList').innerHTML = todayRecs.map(r => `
            <tr>
                <td>${r.time}</td>
                <td>${r.name}</td>
                <td>${r.class}</td>
                <td><strong>${r.status}</strong></td>
            </tr>
        `).join('');

        document.getElementById('journalTable').innerHTML = records.map(r => `
            <tr>
                <td>${r.date}</td>
                <td>${r.time}</td>
                <td>${r.name}</td>
                <td>${r.class}</td>
                <td>${r.status}</td>
                <td>${r.note || '-'}</td>
            </tr>
        `).join('');
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }
</script>
</body>
</html>
